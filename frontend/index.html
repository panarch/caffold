<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="{{CAFFOLD_SERVER_NAME}}" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="{{CAFFOLD_SERVER_NAME}}" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>{{CAFFOLD_SERVER_NAME}}</title>
    <link rel="manifest" href="/assets/manifest.webmanifest" />
    <link
      rel="icon"
      href="/assets/icons/favicon-32.png"
      type="image/png"
      sizes="32x32"
    />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/assets/fonts/D2Coding-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/D2Coding-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      (() => {
        let themeMode = "system";
        try {
          const stored = JSON.parse(
            localStorage.getItem("caffold:settings") ?? "null",
          );
          if (["system", "light", "dark"].includes(stored?.themeMode)) {
            themeMode = stored.themeMode;
          }
        } catch {
          // Use the system theme when local storage is unavailable or invalid.
        }

        const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
        const resolvedTheme =
          themeMode === "system" ? (prefersDark ? "dark" : "light") : themeMode;
        document.documentElement.dataset.theme = resolvedTheme;
        document.documentElement.style.colorScheme = resolvedTheme;
        document.querySelector('meta[name="theme-color"]').content =
          resolvedTheme === "dark" ? "#1b1b1b" : "#ffffff";
      })();
    </script>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <caffold-app-shell></caffold-app-shell>
  </body>
</html>
