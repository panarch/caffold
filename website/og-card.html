<!doctype html>
<!-- The link preview image, docs/assets/brand/og.png. Render it at 1200 x 630;
     see README.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Geist"; src: url("docs/assets/fonts/GeistSans-Variable.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url("docs/assets/fonts/GeistMono-Regular.woff2") format("woff2"); font-weight: 400; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background: #f4f4f2; color: #1b1c1f; font-family: "Geist", sans-serif; position: relative; }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 26px; letter-spacing: -0.02em; }
.brand img { height: 40px; }
h1 { font-weight: 700; letter-spacing: -0.045em; line-height: 1.02; }
h1 span { display: block; }
.url { font-family: "Geist Mono", monospace; font-size: 20px; color: #6b6d73; letter-spacing: 0.02em; }
.pair { display: grid; grid-template-columns: 2.868fr 1fr; gap: 16px; align-items: start; }
.pair img { display: block; width: 100%; height: auto; border-radius: 10px; box-shadow: 0 0 0 1px #d6d6d2, 0 1px 2px rgb(0 0 0 / 5%), 0 18px 40px rgb(0 0 0 / 10%); }
.top { position: absolute; left: 64px; right: 64px; top: 52px; display: flex; align-items: flex-end; justify-content: space-between; }
h1 { font-size: 58px; }
h1 span { display: inline; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.pair { position: absolute; left: 50%; transform: translateX(-50%); top: 190px; width: 960px; }
</style>
</head>
<body>
<div class="top"><h1><span>Leave your desk.</span> <span>Keep working.</span></h1>
<div class="side"><div class="brand"><img src="docs/assets/brand/caffold.png">Caffold</div><div class="url">caffold.dev</div></div></div>
<div class="pair"><img src="docs/assets/screenshots/review-working-tree-foldable.png"><img src="docs/assets/screenshots/task-conversation-phone.png"></div>
</body>
</html>
