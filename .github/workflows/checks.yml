name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test frontend units
        run: npm run test:unit

      - name: Test repository contracts
        run: npm run test:contract

  browser:
    name: Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslc libvulkan-dev

      - name: Install Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build the browser test server
        run: cargo build --locked

      - name: Test browser behavior
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.96
        run: |
          rustup toolchain install 1.96.0 \
            --profile minimal \
            --component clippy \
            --component rustfmt
          rustup default 1.96.0

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslc libvulkan-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --locked

  linux-package:
    name: Linux Package (${{ matrix.release_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            release_arch: x86_64
          - runner: ubuntu-24.04-arm
            release_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils file glslc libvulkan-dev

      - name: Build and verify the native release archive
        run: distribution/linux/package archive

      - name: Upload the verified archive
        uses: actions/upload-artifact@v7
        with:
          name: caffold-pr-linux-${{ matrix.release_arch }}
          path: |
            target/caffold-linux/*.tar.gz
            target/caffold-linux/*.sha256
          if-no-files-found: error
          retention-days: 7
