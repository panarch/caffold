name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Test frontend units
        run: npm run test:unit
        working-directory: frontend

      - name: Test repository contracts
        run: npm run test:contract
        working-directory: frontend

  browser:
    name: Browser Tests / ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, foldable, phone]

    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Chromium
        run: npx playwright install chromium
        working-directory: frontend

      - name: Build the browser test server
        run: cargo build --locked

      - name: Test browser behavior
        run: npm run test:e2e -- --project=${{ matrix.project }}
        working-directory: frontend

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.project }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  browser_gate:
    name: Browser Tests
    if: ${{ always() }}
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every viewport project
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          if [[ "${BROWSER_RESULT}" != "success" ]]; then
            echo "One or more viewport projects did not pass." >&2
            exit 1
          fi

  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.96
        run: |
          rustup toolchain install 1.96.0 \
            --profile minimal \
            --component clippy \
            --component rustfmt
          rustup default 1.96.0

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --locked
