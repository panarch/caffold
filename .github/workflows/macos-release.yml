name: macOS Release

on:
  workflow_call:
    inputs:
      action:
        description: Release action; defaults to verification and packaging without publication.
        type: string
        required: false
        default: dry-run
    outputs:
      release_sha:
        value: ${{ jobs.macos.outputs.release_sha }}
      version:
        value: ${{ jobs.macos.outputs.version }}
      archive:
        value: ${{ jobs.macos.outputs.archive }}
      checksum:
        value: ${{ jobs.macos.outputs.checksum }}
      artifact_name:
        value: ${{ jobs.macos.outputs.artifact_name }}
  workflow_dispatch:
    inputs:
      action:
        description: Test and package macOS arm64 from main; upload artifacts only. No version bump, source push, or publishing.
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run

permissions:
  contents: write

jobs:
  macos:
    name: Build and verify macOS arm64 release
    runs-on: macos-14
    timeout-minutes: 45
    outputs:
      release_sha: ${{ steps.source.outputs.release_sha }}
      version: ${{ steps.metadata.outputs.version }}
      archive: ${{ steps.metadata.outputs.archive }}
      checksum: ${{ steps.metadata.outputs.checksum }}
      artifact_name: caffold-macos-arm64-v${{ steps.metadata.outputs.version }}

    steps:
      - name: Require main
        env:
          SELECTED_REF: ${{ github.ref }}
          RELEASE_ACTION: ${{ inputs.action || 'dry-run' }}
        run: |
          if [[ "${SELECTED_REF}" != "refs/heads/main" ]]; then
            echo "macOS releases must be dispatched from main." >&2
            exit 1
          fi
          case "${RELEASE_ACTION}" in
            dry-run|resume|release-patch|release-minor|release-major) ;;
            *) echo "Unknown release action: ${RELEASE_ACTION}." >&2; exit 1 ;;
          esac

      - name: Check out the requested source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Prepare the local release branch
        env:
          REQUESTED_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "${REQUESTED_SHA}" ]]; then
            echo "main changed after this workflow was dispatched; run it again." >&2
            exit 1
          fi
          # Packaging requires a clean main worktree on this runner.
          git checkout -B main "${REQUESTED_SHA}"

      - name: Install Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Bump the release version locally
        if: startsWith(inputs.action, 'release-')
        id: bump
        env:
          RELEASE_ACTION: ${{ inputs.action }}
        run: |
          bump="${RELEASE_ACTION#release-}"
          node scripts/bump-release-version.mjs "${bump}" >>"${GITHUB_OUTPUT}"

      - name: Require an unused release version
        if: startsWith(inputs.action, 'release-')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists." >&2
            exit 1
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists." >&2
            exit 1
          fi

      - name: Commit the local release candidate
        if: startsWith(inputs.action, 'release-')
        env:
          RELEASE_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          changed_files="$(git diff --name-only | LC_ALL=C sort)"
          expected_files="$(printf '%s\n' Cargo.lock caffold/Cargo.toml frontend/package.json | LC_ALL=C sort)"
          if [[ "${changed_files}" != "${expected_files}" ]]; then
            echo "Version bump changed unexpected files:" >&2
            printf '%s\n' "${changed_files}" >&2
            exit 1
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock caffold/Cargo.toml frontend/package.json
          git commit -m "Release v${RELEASE_VERSION}"

      - name: Record the release source
        id: source
        run: echo "release_sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

      - name: Install Rust 1.96
        run: |
          rustup toolchain install 1.96.0 \
            --profile minimal \
            --component clippy \
            --component rustfmt
          rustup default 1.96.0

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Verify native build tools
        run: |
          cmake --version
          xcrun --find clang

      - name: Read release metadata
        id: metadata
        run: desktop/macos/package-app metadata >>"${GITHUB_OUTPUT}"

      - name: Test macOS packaging contracts
        run: desktop/macos/test-contracts

      - name: Test macOS application behavior
        run: |
          desktop/macos/test-runtime
          desktop/macos/test-system-status
          desktop/macos/test-updater

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Test Rust on macOS
        run: cargo test --locked

      - name: Lint Rust on macOS
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build and verify the macOS artifact
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: desktop/macos/release --dry-run --version "${RELEASE_VERSION}"

      - name: Upload the verified macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: caffold-macos-arm64-v${{ steps.metadata.outputs.version }}
          path: |
            target/caffold-server/${{ steps.metadata.outputs.archive }}
            target/caffold-server/${{ steps.metadata.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

      - name: Push the verified release commit
        if: startsWith(inputs.action, 'release-')
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ github.sha }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "${RELEASE_SHA}" || -n "$(git status --porcelain)" ]]; then
            echo "Release source changed during verification." >&2
            exit 1
          fi
          gh auth setup-git
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "${REQUESTED_SHA}" ]]; then
            echo "main changed after verification; run the release again." >&2
            exit 1
          fi
          git push origin "${RELEASE_SHA}:refs/heads/main"
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{ print $1 }')"
          if [[ "${remote_sha}" != "${RELEASE_SHA}" ]]; then
            echo "main points to ${remote_sha:-nothing}, not ${RELEASE_SHA}." >&2
            exit 1
          fi
