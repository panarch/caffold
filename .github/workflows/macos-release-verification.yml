name: macOS Release Verification

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact source commit to verify
        required: true
        type: string
      require_main_head:
        description: Require the source commit to remain the current main head
        required: false
        default: false
        type: boolean
    outputs:
      release_sha:
        description: Verified source commit
        value: ${{ jobs.verify.outputs.release_sha }}
      version:
        description: Verified release version
        value: ${{ jobs.verify.outputs.version }}
      archive:
        description: Verified release archive filename
        value: ${{ jobs.verify.outputs.archive }}
      checksum:
        description: Verified checksum filename
        value: ${{ jobs.verify.outputs.checksum }}
      artifact_name:
        description: Uploaded verification artifact name
        value: ${{ jobs.verify.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify macOS arm64 release
    runs-on: macos-14
    timeout-minutes: 45
    outputs:
      release_sha: ${{ steps.verify_source.outputs.release_sha }}
      version: ${{ steps.release_metadata.outputs.version }}
      archive: ${{ steps.release_metadata.outputs.archive }}
      checksum: ${{ steps.release_metadata.outputs.checksum }}
      artifact_name: caffold-macos-arm64-v${{ steps.release_metadata.outputs.version }}

    steps:
      - name: Check out the exact release source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Verify the requested commit
        id: verify_source
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          REQUIRE_MAIN_HEAD: ${{ inputs.require_main_head }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "${RELEASE_SHA}" ]]; then
            echo "Checked out source does not match ${RELEASE_SHA}." >&2
            exit 1
          fi
          if [[ "${REQUIRE_MAIN_HEAD}" == "true" ]]; then
            git fetch origin main
            if [[ "$(git rev-parse origin/main)" != "${RELEASE_SHA}" ]]; then
              echo "main changed after this workflow was dispatched; run it again." >&2
              exit 1
            fi
          fi
          echo "release_sha=${RELEASE_SHA}" >>"${GITHUB_OUTPUT}"

      - name: Install Rust 1.96
        run: |
          rustup toolchain install 1.96.0 \
            --profile minimal \
            --component clippy \
            --component rustfmt
          rustup default 1.96.0

      - name: Install Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Verify native build tools
        run: |
          cmake --version
          xcrun --find clang

      - name: Read release metadata
        id: release_metadata
        run: desktop/macos/package-app metadata >>"${GITHUB_OUTPUT}"

      - name: Test frontend units
        run: npm run test:unit

      - name: Test repository contracts
        run: npm run test:contract

      - name: Build browser test server
        run: cargo build --locked

      - name: Test browser behavior
        run: npm run test:e2e

      - name: Test macOS application behavior
        run: npm run test:macos

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Test Rust
        run: cargo test

      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Build and verify the macOS artifact
        env:
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
        run: desktop/macos/release --dry-run --version "${RELEASE_VERSION}"

      - name: Upload the verified macOS artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: caffold-macos-arm64-v${{ steps.release_metadata.outputs.version }}
          path: |
            target/caffold-server/${{ steps.release_metadata.outputs.archive }}
            target/caffold-server/${{ steps.release_metadata.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7
