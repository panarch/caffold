name: Repository Tooling Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  repository_tooling:
    name: Repository Tooling Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out the requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Test repository tooling
        run: node --test scripts/tests/*.test.mjs
