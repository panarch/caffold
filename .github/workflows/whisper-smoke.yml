name: Whisper Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whisper-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tiny-model-cpu:
    name: Tiny multilingual model on Linux CPU
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslc libvulkan-dev

      - name: Download pinned Whisper smoke fixtures
        run: |
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/ggml-tiny.bin" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/fb5ed9369c26eaf08392504d8446da431e0fffb9/ggml-tiny.bin
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/jfk.wav" \
            https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.8.3/samples/jfk.wav
          cd "${RUNNER_TEMP}"
          echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  ggml-tiny.bin" | sha256sum --check
          echo "59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e  jfk.wav" | sha256sum --check

      - name: Transcribe the real WAV on CPU
        env:
          CAFFOLD_WHISPER_MODEL: ${{ runner.temp }}/ggml-tiny.bin
          CAFFOLD_WHISPER_WAV: ${{ runner.temp }}/jfk.wav
        run: >-
          cargo test --locked --lib
          app::voice::tests::live_pinned_model_transcribes_a_real_wav --
          --ignored --exact --nocapture
