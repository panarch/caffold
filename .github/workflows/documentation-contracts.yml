name: Documentation Contracts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test documentation contracts
        run: node --test docs/tests/*.test.mjs

      - name: Install uv
        run: pipx install uv

      - name: Build the user manual
        working-directory: website
        run: uv run --locked zensical build --strict
