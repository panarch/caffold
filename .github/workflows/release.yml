name: Release
run-name: Release (${{ inputs.action }})

on:
  workflow_dispatch:
    inputs:
      action:
        description: Verify, create a version release or release candidate, or resume the current version
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - release-patch
          - release-minor
          - release-major
          - rc-patch
          - rc-minor
          - rc-major
          - resume

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    uses: ./.github/workflows/frontend-tests.yml

  documentation:
    uses: ./.github/workflows/documentation-contracts.yml

  repository_tooling:
    uses: ./.github/workflows/repository-tooling-tests.yml

  macos_packaging:
    uses: ./.github/workflows/macos-packaging-contracts.yml

  linux_packaging:
    uses: ./.github/workflows/linux-packaging-contracts.yml

  browser:
    uses: ./.github/workflows/browser-tests.yml

  rust:
    uses: ./.github/workflows/rust-checks.yml

  macos:
    needs:
      - frontend
      - documentation
      - repository_tooling
      - macos_packaging
      - linux_packaging
      - browser
      - rust
    permissions:
      contents: write
    uses: ./.github/workflows/macos-release.yml
    with:
      action: ${{ inputs.action }}

  # The macOS job makes the release commit; Linux builds that same commit.
  linux:
    needs: macos
    uses: ./.github/workflows/linux-release.yml
    with:
      release_sha: ${{ needs.macos.outputs.release_sha }}

  publish_release:
    name: Publish GitHub Release
    needs:
      - macos
      - linux
    if: inputs.action != 'dry-run'
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.macos.outputs.version }}
      RELEASE_ARCHIVE: ${{ needs.macos.outputs.archive }}
      RELEASE_CHECKSUM: ${{ needs.macos.outputs.checksum }}
      RELEASE_SHA: ${{ needs.macos.outputs.release_sha }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.macos.outputs.release_sha }}

      - name: Download the verified artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.macos.outputs.artifact_name }}
          path: target/caffold-server

      - name: Download the verified Linux artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: caffold-linux-*-v${{ needs.macos.outputs.version }}
          path: target/caffold-linux
          merge-multiple: true

      - name: Verify the downloaded artifact
        run: |
          cd target/caffold-server
          test -f "${RELEASE_ARCHIVE}"
          test -f "${RELEASE_CHECKSUM}"
          shasum -a 256 -c "${RELEASE_CHECKSUM}"
          cd "${GITHUB_WORKSPACE}/target/caffold-linux"
          for arch in x86_64 aarch64; do
            archive="Caffold-${RELEASE_VERSION}-linux-${arch}.tar.gz"
            test -f "${archive}"
            test -f "${archive}.sha256"
            shasum -a 256 -c "${archive}.sha256"
          done

      - name: Publish or verify the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${RELEASE_VERSION}"
          artifact_dir="${GITHUB_WORKSPACE}/target/caffold-server"
          linux_dir="${GITHUB_WORKSPACE}/target/caffold-linux"

          if gh release view "${tag}" >/dev/null 2>&1; then
            if ! gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha >/dev/null 2>&1; then
              echo "${tag} has a release without a matching tag." >&2
              exit 1
            fi
            existing_dir="$(mktemp -d "${RUNNER_TEMP}/caffold-existing-release.XXXXXX")"
            trap 'rm -rf -- "${existing_dir}"' EXIT
            gh release download "${tag}" \
              --pattern "${RELEASE_ARCHIVE}" \
              --pattern "${RELEASE_CHECKSUM}" \
              --dir "${existing_dir}"
            (
              cd "${existing_dir}"
              shasum -a 256 -c "${RELEASE_CHECKSUM}"
            )
            desktop/macos/package-app verify-archive \
              "${existing_dir}/${RELEASE_ARCHIVE}" \
              --expected-version "${RELEASE_VERSION}"
            gh release download "${tag}" \
              --pattern "Caffold-${RELEASE_VERSION}-linux-*" \
              --dir "${existing_dir}"
            (
              cd "${existing_dir}"
              for arch in x86_64 aarch64; do
                shasum -a 256 -c "Caffold-${RELEASE_VERSION}-linux-${arch}.tar.gz.sha256"
              done
            )
            cp "${existing_dir}/${RELEASE_ARCHIVE}" "${artifact_dir}/${RELEASE_ARCHIVE}"
            cp "${existing_dir}/${RELEASE_CHECKSUM}" "${artifact_dir}/${RELEASE_CHECKSUM}"
            echo "${tag} already contains valid release artifacts; reusing them."
          else
            release_args=(
              "${tag}"
              "${artifact_dir}/${RELEASE_ARCHIVE}#Caffold Server ${RELEASE_VERSION} for macOS arm64"
              "${artifact_dir}/${RELEASE_CHECKSUM}#SHA-256 checksum for macOS arm64"
              --title "Caffold ${tag}"
              --generate-notes
            )
            # The notes start from a named tag rather than GitHub's choice, so a
            # stable release never starts from a release candidate: a later
            # candidate starts from the one before it, every other release from
            # the latest stable one.
            notes_start=""
            if [[ "${RELEASE_VERSION}" =~ ^(.+)-rc\.([1-9][0-9]*)$ ]]; then
              release_args+=(--prerelease)
              if (( BASH_REMATCH[2] > 1 )); then
                notes_start="v${BASH_REMATCH[1]}-rc.$(( BASH_REMATCH[2] - 1 ))"
              fi
            fi
            if [[ -z "${notes_start}" ]]; then
              notes_start="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
            fi
            release_args+=(--notes-start-tag "${notes_start}")
            for arch in x86_64 aarch64; do
              archive="Caffold-${RELEASE_VERSION}-linux-${arch}.tar.gz"
              release_args+=(
                "${linux_dir}/${archive}#Caffold ${RELEASE_VERSION} for Linux ${arch}"
                "${linux_dir}/${archive}.sha256#SHA-256 checksum for Linux ${arch}"
              )
            done
            # A candidate's notes open with the command that installs it on
            # Linux, with the install script of the same tag.
            if [[ "${RELEASE_VERSION}" == *-rc.* ]]; then
              install_script="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${tag}/distribution/linux/install.sh"
              notes="$(printf 'Install this release candidate on Linux:\n\n```sh\ncurl -fsSL %s | sh -s -- --version %s\n```\n' "${install_script}" "${RELEASE_VERSION}")"
              release_args+=(--notes "${notes}")
            fi
            if tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha 2>/dev/null)"; then
              if [[ "${tag_sha}" != "${RELEASE_SHA}" ]]; then
                echo "${tag} points to ${tag_sha}, not ${RELEASE_SHA}." >&2
                exit 1
              fi
              release_args+=(--verify-tag)
            else
              release_args+=(--target "${RELEASE_SHA}")
            fi
            gh release create "${release_args[@]}"
          fi

      - name: Preserve the published artifact for Homebrew
        uses: actions/upload-artifact@v7
        with:
          name: published-caffold-macos-arm64-v${{ needs.macos.outputs.version }}
          path: |
            target/caffold-server/${{ needs.macos.outputs.archive }}
            target/caffold-server/${{ needs.macos.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

  publish_homebrew:
    name: Publish Homebrew Cask
    needs:
      - macos
      - publish_release
    if: startsWith(inputs.action, 'release-') || inputs.action == 'resume'
    environment: release
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.macos.outputs.version }}
      RELEASE_ARCHIVE: ${{ needs.macos.outputs.archive }}
      RELEASE_CHECKSUM: ${{ needs.macos.outputs.checksum }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.macos.outputs.release_sha }}

      - name: Download the verified artifact
        uses: actions/download-artifact@v8
        with:
          name: published-caffold-macos-arm64-v${{ needs.macos.outputs.version }}
          path: target/caffold-server

      - name: Verify the downloaded artifact
        run: |
          cd target/caffold-server
          test -f "${RELEASE_ARCHIVE}"
          test -f "${RELEASE_CHECKSUM}"
          shasum -a 256 -c "${RELEASE_CHECKSUM}"

      - name: Check out the Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: panarch/homebrew-tap
          ref: main
          path: homebrew-tap
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Render the Cask
        run: |
          archive_sha="$(awk '{print $1}' "target/caffold-server/${RELEASE_CHECKSUM}")"
          desktop/macos/render-cask \
            --version "${RELEASE_VERSION}" \
            --sha256 "${archive_sha}" \
            >homebrew-tap/Casks/caffold.rb

      - name: Prepare the unpublished Homebrew tap update
        id: tap_update
        working-directory: homebrew-tap
        run: |
          if [[ -z "$(git status --porcelain -- Casks/caffold.rb)" ]]; then
            echo "Casks/caffold.rb already describes v${RELEASE_VERSION}."
            echo "changed=false" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/caffold.rb
          git commit -m "Update Caffold to ${RELEASE_VERSION}"
          echo "changed=true" >>"${GITHUB_OUTPUT}"

      - name: Audit and install the unpublished tap checkout
        run: |
          brew tap panarch/tap "${GITHUB_WORKSPACE}/homebrew-tap"
          brew trust --cask panarch/tap/caffold
          brew style panarch/tap
          brew audit --cask --strict panarch/tap/caffold
          brew install --cask panarch/tap/caffold
          test -d "/Applications/Caffold Server.app"
          command -v caffold
          caffold --help | grep -F "browser-based review and control surface"
          if xattr -p com.apple.quarantine "/Applications/Caffold Server.app" >/dev/null 2>&1; then
            echo "The installed app is still quarantined." >&2
            exit 1
          fi
          brew uninstall --cask panarch/tap/caffold

      - name: Update the Homebrew tap
        if: steps.tap_update.outputs.changed == 'true'
        working-directory: homebrew-tap
        run: git push origin HEAD:main

  publish_site:
    name: Publish the website
    needs:
      - macos
      - publish_homebrew
    if: startsWith(inputs.action, 'release-') || inputs.action == 'resume'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ needs.macos.outputs.release_sha }}

    steps:
      # Git accepts the push to site as a fast-forward only when the commit
      # site points to is in the local history, so this checkout keeps it all.
      - name: Check out the release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.macos.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: true

      # Cloudflare builds caffold.dev from the site branch, so the published
      # manual moves only once the release it describes installs from Homebrew.
      - name: Move the site branch to the release
        run: git push origin "${RELEASE_SHA}:refs/heads/site"
