name: Release
run-name: Release (${{ inputs.action }})

on:
  workflow_dispatch:
    inputs:
      action:
        description: Verify, create a version release, or resume the current version
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - release-patch
          - release-minor
          - release-major
          - resume

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    uses: ./.github/workflows/frontend-tests.yml

  documentation:
    uses: ./.github/workflows/documentation-contracts.yml

  repository_tooling:
    uses: ./.github/workflows/repository-tooling-tests.yml

  macos_packaging:
    uses: ./.github/workflows/macos-packaging-contracts.yml

  browser:
    uses: ./.github/workflows/browser-tests.yml

  rust:
    uses: ./.github/workflows/rust-checks.yml

  macos:
    needs:
      - frontend
      - documentation
      - repository_tooling
      - macos_packaging
      - browser
      - rust
    permissions:
      contents: write
    uses: ./.github/workflows/macos-release.yml
    with:
      action: ${{ inputs.action }}

  publish_release:
    name: Publish GitHub Release
    needs: macos
    if: inputs.action != 'dry-run'
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.macos.outputs.version }}
      RELEASE_ARCHIVE: ${{ needs.macos.outputs.archive }}
      RELEASE_CHECKSUM: ${{ needs.macos.outputs.checksum }}
      RELEASE_SHA: ${{ needs.macos.outputs.release_sha }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.macos.outputs.release_sha }}

      - name: Download the verified artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.macos.outputs.artifact_name }}
          path: target/caffold-server

      - name: Verify the downloaded artifact
        run: |
          cd target/caffold-server
          test -f "${RELEASE_ARCHIVE}"
          test -f "${RELEASE_CHECKSUM}"
          shasum -a 256 -c "${RELEASE_CHECKSUM}"

      - name: Publish or verify the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${RELEASE_VERSION}"
          artifact_dir="${GITHUB_WORKSPACE}/target/caffold-server"

          if gh release view "${tag}" >/dev/null 2>&1; then
            if ! gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha >/dev/null 2>&1; then
              echo "${tag} has a release without a matching tag." >&2
              exit 1
            fi
            existing_dir="$(mktemp -d "${RUNNER_TEMP}/caffold-existing-release.XXXXXX")"
            trap 'rm -rf -- "${existing_dir}"' EXIT
            gh release download "${tag}" \
              --pattern "${RELEASE_ARCHIVE}" \
              --pattern "${RELEASE_CHECKSUM}" \
              --dir "${existing_dir}"
            (
              cd "${existing_dir}"
              shasum -a 256 -c "${RELEASE_CHECKSUM}"
            )
            desktop/macos/package-app verify-archive \
              "${existing_dir}/${RELEASE_ARCHIVE}" \
              --expected-version "${RELEASE_VERSION}"
            cp "${existing_dir}/${RELEASE_ARCHIVE}" "${artifact_dir}/${RELEASE_ARCHIVE}"
            cp "${existing_dir}/${RELEASE_CHECKSUM}" "${artifact_dir}/${RELEASE_CHECKSUM}"
            echo "${tag} already contains valid release artifacts; reusing them."
          else
            release_args=(
              "${tag}"
              "${artifact_dir}/${RELEASE_ARCHIVE}#Caffold Server ${RELEASE_VERSION} for macOS arm64"
              "${artifact_dir}/${RELEASE_CHECKSUM}#SHA-256 checksum"
              --title "Caffold ${tag}"
              --generate-notes
            )
            if tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha 2>/dev/null)"; then
              if [[ "${tag_sha}" != "${RELEASE_SHA}" ]]; then
                echo "${tag} points to ${tag_sha}, not ${RELEASE_SHA}." >&2
                exit 1
              fi
              release_args+=(--verify-tag)
            else
              release_args+=(--target "${RELEASE_SHA}")
            fi
            gh release create "${release_args[@]}"
          fi

      - name: Preserve the published artifact for Homebrew
        uses: actions/upload-artifact@v7
        with:
          name: published-caffold-macos-arm64-v${{ needs.macos.outputs.version }}
          path: |
            target/caffold-server/${{ needs.macos.outputs.archive }}
            target/caffold-server/${{ needs.macos.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

  publish_homebrew:
    name: Publish Homebrew Cask
    needs:
      - macos
      - publish_release
    if: inputs.action != 'dry-run'
    environment: release
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.macos.outputs.version }}
      RELEASE_ARCHIVE: ${{ needs.macos.outputs.archive }}
      RELEASE_CHECKSUM: ${{ needs.macos.outputs.checksum }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.macos.outputs.release_sha }}

      - name: Download the verified artifact
        uses: actions/download-artifact@v8
        with:
          name: published-caffold-macos-arm64-v${{ needs.macos.outputs.version }}
          path: target/caffold-server

      - name: Verify the downloaded artifact
        run: |
          cd target/caffold-server
          test -f "${RELEASE_ARCHIVE}"
          test -f "${RELEASE_CHECKSUM}"
          shasum -a 256 -c "${RELEASE_CHECKSUM}"

      - name: Check out the Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: panarch/homebrew-tap
          ref: main
          path: homebrew-tap
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Render the Cask
        run: |
          archive_sha="$(awk '{print $1}' "target/caffold-server/${RELEASE_CHECKSUM}")"
          desktop/macos/render-cask \
            --version "${RELEASE_VERSION}" \
            --sha256 "${archive_sha}" \
            >homebrew-tap/Casks/caffold.rb

      - name: Prepare the unpublished Homebrew tap update
        id: tap_update
        working-directory: homebrew-tap
        run: |
          if [[ -z "$(git status --porcelain -- Casks/caffold.rb)" ]]; then
            echo "Casks/caffold.rb already describes v${RELEASE_VERSION}."
            echo "changed=false" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/caffold.rb
          git commit -m "Update Caffold to ${RELEASE_VERSION}"
          echo "changed=true" >>"${GITHUB_OUTPUT}"

      - name: Audit and install the unpublished tap checkout
        run: |
          brew tap panarch/tap "${GITHUB_WORKSPACE}/homebrew-tap"
          brew trust --cask panarch/tap/caffold
          brew style panarch/tap
          brew audit --cask --strict panarch/tap/caffold
          brew install --cask panarch/tap/caffold
          test -d "/Applications/Caffold Server.app"
          command -v caffold
          caffold --help | grep -F "browser-based review and control surface"
          if xattr -p com.apple.quarantine "/Applications/Caffold Server.app" >/dev/null 2>&1; then
            echo "The installed app is still quarantined." >&2
            exit 1
          fi
          brew uninstall --cask panarch/tap/caffold

      - name: Update the Homebrew tap
        if: steps.tap_update.outputs.changed == 'true'
        working-directory: homebrew-tap
        run: git push origin HEAD:main
