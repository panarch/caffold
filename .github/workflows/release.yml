name: Release
run-name: Release (${{ inputs.action }})

on:
  workflow_dispatch:
    inputs:
      action:
        description: Verify, create a version release, or resume the current version
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - release-patch
          - release-minor
          - release-major
          - resume

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump_release:
    name: Commit release version
    if: startsWith(inputs.action, 'release-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      release_sha: ${{ steps.release_commit.outputs.release_sha }}

    steps:
      - name: Require main
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "${SELECTED_REF}" != "refs/heads/main" ]]; then
            echo "Release runs must be dispatched from main, not ${SELECTED_REF}." >&2
            exit 1
          fi

      - name: Check out the complete release history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main

      - name: Verify the requested commit
        env:
          REQUESTED_SHA: ${{ github.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "${REQUESTED_SHA}" ]]; then
            echo "main changed after this workflow was dispatched; run it again." >&2
            exit 1
          fi

      - name: Install Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Bump the release version
        id: bump
        env:
          RELEASE_ACTION: ${{ inputs.action }}
        run: |
          bump="${RELEASE_ACTION#release-}"
          node scripts/bump-release-version.mjs "${bump}" >>"${GITHUB_OUTPUT}"

      - name: Require an unused release version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists." >&2
            exit 1
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists." >&2
            exit 1
          fi

      - name: Commit and push the release version
        id: release_commit
        env:
          RELEASE_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          changed_files="$(git diff --name-only | LC_ALL=C sort)"
          expected_files="$(printf '%s\n' Cargo.lock Cargo.toml package.json | LC_ALL=C sort)"
          if [[ "${changed_files}" != "${expected_files}" ]]; then
            echo "Version bump changed unexpected files:" >&2
            printf '%s\n' "${changed_files}" >&2
            exit 1
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock Cargo.toml package.json
          git commit -m "Release v${RELEASE_VERSION}"
          git push origin HEAD:main
          echo "release_sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

  macos:
    name: Verify macOS arm64 release
    needs: bump_release
    if: always() && (needs.bump_release.result == 'success' || needs.bump_release.result == 'skipped')
    runs-on: macos-14
    timeout-minutes: 45
    outputs:
      release_sha: ${{ steps.release_source.outputs.release_sha }}
      version: ${{ steps.release_metadata.outputs.version }}
      archive: ${{ steps.release_metadata.outputs.archive }}
      checksum: ${{ steps.release_metadata.outputs.checksum }}
      artifact_name: caffold-macos-arm64-v${{ steps.release_metadata.outputs.version }}

    steps:
      - name: Require main
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "${SELECTED_REF}" != "refs/heads/main" ]]; then
            echo "Release runs must be dispatched from main, not ${SELECTED_REF}." >&2
            exit 1
          fi

      - name: Resolve the release source
        id: release_source
        env:
          BUMP_RELEASE_SHA: ${{ needs.bump_release.outputs.release_sha }}
          REQUESTED_SHA: ${{ github.sha }}
        run: |
          release_sha="${BUMP_RELEASE_SHA:-${REQUESTED_SHA}}"
          echo "release_sha=${release_sha}" >>"${GITHUB_OUTPUT}"

      - name: Check out the complete release history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Verify the requested commit
        env:
          RELEASE_SHA: ${{ steps.release_source.outputs.release_sha }}
        run: |
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "${RELEASE_SHA}" ]]; then
            echo "Checked out source does not match ${RELEASE_SHA}." >&2
            exit 1
          fi
          if [[ "$(git rev-parse origin/main)" != "${RELEASE_SHA}" ]]; then
            echo "main changed after this workflow was dispatched; run it again." >&2
            exit 1
          fi

      - name: Install Rust 1.96
        run: |
          rustup toolchain install 1.96.0 \
            --profile minimal \
            --component clippy \
            --component rustfmt
          rustup default 1.96.0

      - name: Install Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Read release metadata
        id: release_metadata
        run: desktop/macos/package-app metadata >>"${GITHUB_OUTPUT}"

      - name: Verify release contracts
        run: npm run test:release

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Test Rust
        run: cargo test

      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Build and verify the macOS artifact
        env:
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
        run: desktop/macos/release --dry-run --version "${RELEASE_VERSION}"

      - name: Upload the verified macOS artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: caffold-macos-arm64-v${{ steps.release_metadata.outputs.version }}
          path: |
            target/caffold-server/${{ steps.release_metadata.outputs.archive }}
            target/caffold-server/${{ steps.release_metadata.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

  publish_release:
    name: Publish GitHub Release
    needs: macos
    if: inputs.action != 'dry-run'
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.macos.outputs.version }}
      RELEASE_ARCHIVE: ${{ needs.macos.outputs.archive }}
      RELEASE_CHECKSUM: ${{ needs.macos.outputs.checksum }}
      RELEASE_SHA: ${{ needs.macos.outputs.release_sha }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.macos.outputs.release_sha }}

      - name: Download the verified artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.macos.outputs.artifact_name }}
          path: target/caffold-server

      - name: Verify the downloaded artifact
        run: |
          cd target/caffold-server
          test -f "${RELEASE_ARCHIVE}"
          test -f "${RELEASE_CHECKSUM}"
          shasum -a 256 -c "${RELEASE_CHECKSUM}"

      - name: Publish or verify the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${RELEASE_VERSION}"
          artifact_dir="${GITHUB_WORKSPACE}/target/caffold-server"

          if gh release view "${tag}" >/dev/null 2>&1; then
            if ! tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha 2>/dev/null)"; then
              echo "${tag} has a release without a matching tag." >&2
              exit 1
            fi
            existing_dir="$(mktemp -d "${RUNNER_TEMP}/caffold-existing-release.XXXXXX")"
            trap 'rm -rf -- "${existing_dir}"' EXIT
            gh release download "${tag}" \
              --pattern "${RELEASE_ARCHIVE}" \
              --pattern "${RELEASE_CHECKSUM}" \
              --dir "${existing_dir}"
            (
              cd "${existing_dir}"
              shasum -a 256 -c "${RELEASE_CHECKSUM}"
            )
            tag_build_number="$(git rev-list --count "${tag_sha}")"
            desktop/macos/package-app verify-archive \
              "${existing_dir}/${RELEASE_ARCHIVE}" \
              --expected-version "${RELEASE_VERSION}" \
              --expected-build-number "${tag_build_number}"
            cp "${existing_dir}/${RELEASE_ARCHIVE}" "${artifact_dir}/${RELEASE_ARCHIVE}"
            cp "${existing_dir}/${RELEASE_CHECKSUM}" "${artifact_dir}/${RELEASE_CHECKSUM}"
            echo "${tag} already contains valid release artifacts; reusing them."
          else
            release_args=(
              "${tag}"
              "${artifact_dir}/${RELEASE_ARCHIVE}#Caffold Server ${RELEASE_VERSION} for macOS arm64"
              "${artifact_dir}/${RELEASE_CHECKSUM}#SHA-256 checksum"
              --title "Caffold ${tag}"
              --generate-notes
            )
            if tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha 2>/dev/null)"; then
              if [[ "${tag_sha}" != "${RELEASE_SHA}" ]]; then
                echo "${tag} points to ${tag_sha}, not ${RELEASE_SHA}." >&2
                exit 1
              fi
              release_args+=(--verify-tag)
            else
              release_args+=(--target "${RELEASE_SHA}")
            fi
            gh release create "${release_args[@]}"
          fi

      - name: Preserve the published artifact for Homebrew
        uses: actions/upload-artifact@v7.0.1
        with:
          name: published-caffold-macos-arm64-v${{ needs.macos.outputs.version }}
          path: |
            target/caffold-server/${{ needs.macos.outputs.archive }}
            target/caffold-server/${{ needs.macos.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

  publish_homebrew:
    name: Publish Homebrew Cask
    needs:
      - macos
      - publish_release
    if: inputs.action != 'dry-run'
    environment: release
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.macos.outputs.version }}
      RELEASE_ARCHIVE: ${{ needs.macos.outputs.archive }}
      RELEASE_CHECKSUM: ${{ needs.macos.outputs.checksum }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.macos.outputs.release_sha }}

      - name: Download the verified artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: published-caffold-macos-arm64-v${{ needs.macos.outputs.version }}
          path: target/caffold-server

      - name: Verify the downloaded artifact
        run: |
          cd target/caffold-server
          test -f "${RELEASE_ARCHIVE}"
          test -f "${RELEASE_CHECKSUM}"
          shasum -a 256 -c "${RELEASE_CHECKSUM}"

      - name: Check out the Homebrew tap
        uses: actions/checkout@v7.0.1
        with:
          repository: panarch/homebrew-tap
          ref: main
          path: homebrew-tap
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Render the Cask
        run: |
          archive_sha="$(awk '{print $1}' "target/caffold-server/${RELEASE_CHECKSUM}")"
          desktop/macos/render-cask \
            --version "${RELEASE_VERSION}" \
            --sha256 "${archive_sha}" \
            >homebrew-tap/Casks/caffold.rb

      - name: Audit and install the unpublished tap checkout
        run: |
          brew tap panarch/tap "${GITHUB_WORKSPACE}/homebrew-tap"
          brew trust --cask panarch/tap/caffold
          brew style panarch/tap
          brew audit --cask --strict panarch/tap/caffold
          brew install --cask panarch/tap/caffold
          test -d "/Applications/Caffold Server.app"
          command -v caffold
          caffold --help | grep -F "browser-based review and control surface"
          if xattr -p com.apple.quarantine "/Applications/Caffold Server.app" >/dev/null 2>&1; then
            echo "The installed app is still quarantined." >&2
            exit 1
          fi
          brew uninstall --cask panarch/tap/caffold

      - name: Update the Homebrew tap
        working-directory: homebrew-tap
        run: |
          if [[ -z "$(git status --porcelain -- Casks/caffold.rb)" ]]; then
            echo "Casks/caffold.rb already describes v${RELEASE_VERSION}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/caffold.rb
          git commit -m "Update Caffold to ${RELEASE_VERSION}"
          git push origin HEAD:main
