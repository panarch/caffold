name: Release Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Verify macOS arm64 release
    uses: ./.github/workflows/macos-release-verification.yml
    with:
      release_sha: ${{ github.sha }}
      require_main_head: false
