name: Browser Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    name: Browser Tests / ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # A viewport failure is usually specific to that viewport, so let the
      # others finish and report. Cancelling them hides whether the change broke
      # one layout or all of them.
      fail-fast: false
      matrix:
        project: [desktop, foldable, phone]

    steps:
      - name: Check out the requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Chromium
        run: npx playwright install chromium
        working-directory: frontend

      - name: Build the browser test server
        run: cargo build --locked

      - name: Test browser behavior
        run: npm run test:e2e -- --project=${{ matrix.project }}
        working-directory: frontend

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.project }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
